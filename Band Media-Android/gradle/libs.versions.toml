appcompat = "1.7.0"
composeBom = "2026.05.00"
composeMultiplatform = "1.11.1"
navigationCompose = "2.8.0"
navigationEvent = "1.1.2"
miuix = "0.9.3"
junit = "4.13.2"
junitVersion = "1.2.0"
espressoCore = "3.6.0"
bouncycastle = "1.85"
